[package]
name = "korgi_beats_oss"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.5.3", features = ["rand"] }
axum = { version = "0.8.9", features = ["multipart"] }
dotenvy = "0.15.7"
envy = "0.4.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros", "uuid"] }
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.24.0", features = ["v4"] }
validator = { version = "0.21.0", features = ["derive"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
chrono = { version = "0.4.45", features = ["serde"] }
sha2 = "0.11.0"
hex = "0.4.3"
tokio-util = { version = "0.7.19", features = ["io"] }
symphonia = { version = "0.6.0", features = ["mp3", "wav", "pcm", "ogg", "vorbis"] }
rustfft = "6.4.1"
